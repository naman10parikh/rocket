<text x="24" y="66" fill="#7fc492">$ <tspan fill="#f3f0e8">rocket --help</tspan></text>
<text x="24" y="86" fill="#d8d3c8" xml:space="preserve">Usage: rocket [options] [command]</text>
<text x="24" y="106" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="126" fill="#d8d3c8" xml:space="preserve">release-engineering employee — wire CI, prove a deploy is real, roll it back.</text>
<text x="24" y="146" fill="#d8d3c8" xml:space="preserve">Verify, don't trust the checkmark.</text>
<text x="24" y="166" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="186" fill="#d8d3c8" xml:space="preserve">Options:</text>
<text x="24" y="206" fill="#d8d3c8" xml:space="preserve">  -v, --version           print rocket's version</text>
<text x="24" y="226" fill="#d8d3c8" xml:space="preserve">  -h, --help              display help for command</text>
<text x="24" y="246" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="266" fill="#d8d3c8" xml:space="preserve">Commands:</text>
<text x="24" y="286" fill="#d8d3c8" xml:space="preserve">  wire [options]          generate a valid, actionlint-clean GHA workflow +</text>
<text x="24" y="306" fill="#d8d3c8" xml:space="preserve">                          deploy config for &lt;target&gt;; this is THE acceptance</text>
<text x="24" y="326" fill="#d8d3c8" xml:space="preserve">                          test</text>
<text x="24" y="346" fill="#d8d3c8" xml:space="preserve">  audit [options] &lt;path&gt;  sweep a workflow / .github/workflows for the 2026</text>
<text x="24" y="366" fill="#d8d3c8" xml:space="preserve">                          attack classes (mutable-tag/non-SHA uses:, pwn-request</text>
<text x="24" y="386" fill="#d8d3c8" xml:space="preserve">                          (pull_request_target + checkout-of-head),</text>
<text x="24" y="406" fill="#d8d3c8" xml:space="preserve">                          paths-as-required-check) + actionlint/zizmor</text>
<text x="24" y="426" fill="#d8d3c8" xml:space="preserve">  verify [options]        both-axes deploy check: deployed SHA == HEAD (+</text>
<text x="24" y="446" fill="#d8d3c8" xml:space="preserve">                          behavior smoke). Emits GO/NO-GO. Refuses to trust a</text>
<text x="24" y="466" fill="#d8d3c8" xml:space="preserve">                          checkmark</text>
<text x="24" y="486" fill="#d8d3c8" xml:space="preserve">  rollback [options]      execute the rollback hierarchy fastest-first (flag →</text>
<text x="24" y="506" fill="#d8d3c8" xml:space="preserve">                          alias re-point → image-pin → git-revert)</text>
<text x="24" y="526" fill="#d8d3c8" xml:space="preserve">  eval-gate [options]     gate agent/prompt changes on regression vs a rolling</text>
<text x="24" y="546" fill="#d8d3c8" xml:space="preserve">                          baseline + an absolute floor (dual threshold);</text>
<text x="24" y="566" fill="#d8d3c8" xml:space="preserve">                          noSelfGrading</text>
<text x="24" y="586" fill="#d8d3c8" xml:space="preserve">…</text>
