name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  harness-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harness skeleton present
        run: |
          set -e
          for f in identity/SOUL.md brain dsip.json AGENTS.md CLAUDE.md llms.txt .claude-plugin/plugin.json .mcp.json; do
            [ -e "$f" ] || { echo "MISSING: $f"; exit 1; }
          done
          echo "harness skeleton OK"
      - name: Secret scan (no real keys in tree)
        run: |
          set -e
          if grep -rInE 'sk-ant-[A-Za-z0-9_-]{20,}|sk_live_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|xox[bap]-' \
               --exclude-dir=.git --exclude-dir=node_modules . ; then
            echo "::error::potential real secret committed"; exit 1
          fi
          echo "secret scan clean"

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect runtime
        id: rt
        run: |
          if [ -f package.json ]; then echo "armed=true" >> "$GITHUB_OUTPUT"; else echo "armed=false" >> "$GITHUB_OUTPUT"; fi
      - uses: pnpm/action-setup@v4
        if: steps.rt.outputs.armed == 'true'
        with:
          version: 9
      - uses: actions/setup-node@v4
        if: steps.rt.outputs.armed == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tools/rocket/pnpm-lock.yaml
      - name: Install actionlint (the wire integration test gates on it — same as acceptance.yml)
        if: steps.rt.outputs.armed == 'true'
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Install + build + test (red-blocking once code exists)
        if: steps.rt.outputs.armed == 'true'
        run: |
          cd tools/rocket
          pnpm install --frozen-lockfile || pnpm install
          pnpm build
          pnpm test
      - name: Skeleton phase
        if: steps.rt.outputs.armed == 'false'
        run: echo "skeleton phase — build gate auto-arms when package.json lands (CP123 Wave B)"

  cockpit:
    # Wave-T: the cockpit's two test layers, RED-BLOCKING (PLAN §9 "Component" + "E2E (Playwright)";
    # HARNESS-OVERRIDES §9 "Playwright (cockpit) red-blocking in CI"). The component test exercises the
    # read-only JSON API in isolation; the E2E renders the vanilla-JS SPA in a real headless browser and
    # asserts all four views. Both fail the job on any failure. Screenshots upload as evidence artifacts.
    runs-on: ubuntu-latest
    # Backstop: a Playwright/browser-download hang fast-fails at 12min instead of GitHub's 6h job ceiling.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tools/rocket/pnpm-lock.yaml
      - name: Build the CLI (the cockpit's /api/evals runs eval/run.mjs → imports tools/rocket/dist/)
        run: |
          cd tools/rocket
          pnpm install --frozen-lockfile || pnpm install
          pnpm build
      - name: Seed the on-disk data the views render (a run-log line + the golden-task grid)
        run: |
          node tools/rocket/dist/cli.js verify --target ./fixtures/stale-sha-fixture || true
          npm run eval
      - name: Cockpit COMPONENT tests (the read-only JSON API in isolation — red-blocking)
        run: node --test web/test/cockpit-api.test.mjs
      # Download-only — NO `--with-deps` apt. The apt phase is the unkillable-by-`timeout` sudo-grandchild
      # 6h-hang (turbo Wave-T); GH ubuntu-latest already ships chromium's system libs, so apt is redundant.
      # Call the global binary directly (NOT `npx --yes`, which re-resolves+re-downloads). `timeout 200`×3
      # fast-fails a stalled secondary-artifact (headless-shell) CDN pull and retries; loud red if all stall.
      - name: Install Playwright + chromium (download only — NO apt, retry transient stalls)
        run: |
          npm i -g playwright@1.58.2
          ok=0
          for i in 1 2 3; do
            if timeout 200 playwright install chromium; then ok=1; break; fi
            echo "::warning::playwright chromium install attempt $i stalled (>200s) — retrying"
          done
          [ "$ok" = 1 ] || { echo "::error::playwright chromium install failed after 3 attempts"; exit 1; }
      - name: Cockpit E2E (real headless browser renders all four views — red-blocking)
        run: SHOTS_DIR="$RUNNER_TEMP/cockpit-shots" node web/test/cockpit-e2e.mjs
      - name: Upload cockpit screenshots (evidence — Cluster G "Playwright E2E screenshots in Wave T")
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-screenshots
          path: ${{ runner.temp }}/cockpit-shots/
          if-no-files-found: ignore
