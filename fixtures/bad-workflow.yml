# FIXTURE — deliberately bad GitHub Actions workflow (NON-acceptance test input).
# Consumed by: rocket audit / ref-lint (B2) · golden tasks G1 (non-SHA uses) + G8 (paths-as-required-check).
# This file is intentionally UNSAFE so the linters/golden-tasks have something to flag. Do NOT "fix" it.
name: ci
on:
  # paths-as-required-check trap (Sc.10 / G8): a path-filtered workflow listed as a REQUIRED status
  # check is un-mergeable when the path doesn't change — it stays Pending forever.
  pull_request:
    paths:
      - "src/**"
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # P0 mutable-tag class (Sc.1 tj-actions): non-SHA refs run whatever the tag points to at runtime.
      - uses: actions/checkout@v4
      - uses: tj-actions/changed-files@v44
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && npm run build
