# Golden task G1 — Non-SHA action ref (Scenario 1: tj-actions / CVE-2025-30066)
# A workflow with `uses: tj-actions/changed-files@v44` → rocket must flag P0 (the mutable-tag class),
# and the audit verb proposes a SHA-pin + a secret-rotation checklist. Deterministic L1 (ref-lint).
id: G1
scenario: tj-actions non-SHA uses (mutable-tag P0)
level: L1
tier: ci
command: audit
workflow: |
  name: ci
  on: { push: { branches: [main] } }
  jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: tj-actions/changed-files@v44
        - uses: actions/setup-node@a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0
expect_unpinned: 2
expect_action: tj-actions/changed-files
expect_not_all_pinned: "true"
